<section class="page counter-page">
  <div>
    <p class="eyebrow">Demo</p>
    <h1>Counter</h1>
  </div>

  <div class="counter-display">{{ currentCount }}</div>

  <div class="counter-actions">
    <button type="button" class="button" (click)="decrement()">Decrease</button>
    <button type="button" class="button" (click)="reset()">Reset</button>
    <button type="button" class="button primary" (click)="increment()">Increase</button>
  </div>
</section>
