<section class="page player-form-page">
  <div class="page-header">
    <div>
      <p class="eyebrow">Players</p>
      <h1>Edit Player</h1>
    </div>
    <a routerLink="/players" class="button">Back to list</a>
  </div>

  @if (errorMessage) {
    <p class="alert">{{ errorMessage }}</p>
  }

  @if (isLoading) {
    <p class="empty">Loading player...</p>
  } @else {
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-grid">
        <label>
          Shirt No
          <input formControlName="shirtNo" id="shirtNo" type="number" />
        </label>

        <label>
          Name
          <input formControlName="name" id="name" type="text" />
        </label>

        <label>
          Position
          <select formControlName="positionId" id="positionId">
            <option [ngValue]="null">- Select -</option>
            @if (positions$ | async; as positions) {
              @for (position of positions; track position.id) {
                <option [ngValue]="position.id">{{ position.name }}</option>
              }
            }
          </select>
        </label>

        <label>
          Appearances
          <input formControlName="appearances" id="appearances" type="number" />
        </label>

        <label>
          Goals
          <input formControlName="goals" id="goals" type="number" />
        </label>

        <label>
          Goals per match
          <input formControlName="goalsPerMatch" id="goalsPerMatch" type="number" step="0.01" />
        </label>
      </div>

      <div class="pitch-section">
        <div>
          <h2>Pitch position</h2>
          <p>Drag the player to update the exact location on the pitch.</p>
        </div>

        <div class="pitch-boundary">
          <div
            class="player"
            cdkDrag
            cdkDragBoundary=".pitch-boundary"
            [cdkDragFreeDragPosition]="dragPosition"
            (cdkDragEnded)="onDragEnded($event)"
          >
            <img src="images/player.JPG" alt="Player" />
          </div>
        </div>

        <div class="position-grid">
          <label>
            Position X
            <input formControlName="positionX" id="positionX" type="number" readonly />
          </label>
          <label>
            Position Y
            <input formControlName="positionY" id="positionY" type="number" readonly />
          </label>
        </div>
      </div>

      <button class="button primary" type="submit" [disabled]="editForm.invalid">Save</button>
    </form>
  }
</section>
